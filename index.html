<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>OCD Live</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Concept : une vitrine blanche, une Afrique éclairée à l’or, du cuivre pour agir. */
:root{
 --cu:#B3541C;--cu-d:#8C3F10;--on-cu:#FFFFFF;--cu-soft:#FCEBDD;
 --gold:#F2B33D;--gold-hi:#FFD47A;--glow:rgba(242,179,61,.5);
 --bg:#FFFFFF;--bg2:#FAF5EF;--card:#FFFFFF;--ink:#17110D;--ink2:#5F5148;--line:#EBDFD2;
 --bg-a:rgba(255,255,255,.88);--map-fill:#FFF9F1;
 --hero-overlay:linear-gradient(90deg,rgba(255,255,255,.96) 0%,rgba(255,255,255,.88) 45%,rgba(255,255,255,.18) 100%);
 --dark:#17110D;--on-dark:#F8F1E8;--dark2:#241B15;--dark-line:#3A2C22;
 --ok:#1D7A4A;--ok-bg:#E3F3EA;--warn:#8F5A0E;--warn-bg:#FBF0D9;--bad:#A8321C;--bad-bg:#FBE4DE;
 --display:'Bricolage Grotesque',system-ui,sans-serif;--body:'Figtree',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --cu:#EE8F50;--cu-d:#F5AE7C;--on-cu:#1C0F06;--cu-soft:#2E1B10;
 --bg:#120D0A;--bg2:#1A130E;--card:#1D1611;--ink:#F7F0E8;--ink2:#BBAB9B;--line:#36291F;
 --bg-a:rgba(18,13,10,.88);--map-fill:#1F1812;--dark:#0A0604;--dark2:#17100B;--dark-line:#33261C;
 --hero-overlay:linear-gradient(90deg,rgba(18,13,10,.96) 0%,rgba(18,13,10,.88) 45%,rgba(18,13,10,.24) 100%);
 --ok:#58C88A;--ok-bg:#12281C;--warn:#E9B558;--warn-bg:#2B2110;--bad:#F08A72;--bad-bg:#2D1510;color-scheme:dark}}
:root[data-theme="dark"]{
 --cu:#EE8F50;--cu-d:#F5AE7C;--on-cu:#1C0F06;--cu-soft:#2E1B10;
 --bg:#120D0A;--bg2:#1A130E;--card:#1D1611;--ink:#F7F0E8;--ink2:#BBAB9B;--line:#36291F;
 --bg-a:rgba(18,13,10,.88);--map-fill:#1F1812;--dark:#0A0604;--dark2:#17100B;--dark-line:#33261C;
 --hero-overlay:linear-gradient(90deg,rgba(18,13,10,.96) 0%,rgba(18,13,10,.88) 45%,rgba(18,13,10,.24) 100%);
 --ok:#58C88A;--ok-bg:#12281C;--warn:#E9B558;--warn-bg:#2B2110;--bad:#F08A72;--bad-bg:#2D1510;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}a{color:inherit}button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ic{flex:none}
.w{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sec{padding-block:clamp(56px,8vw,104px)}
.alt{background:var(--bg2)}
.dk{background:var(--dark);color:var(--on-dark);--logo-ink:var(--on-dark)}
.eyebrow{display:inline-flex;align-items:center;gap:.5rem;font:600 .78rem/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--cu)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--cu);box-shadow:0 0 0 0 var(--glow);animation:ping 2.2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 9px rgba(242,179,61,0)}100%{box-shadow:0 0 0 0 rgba(242,179,61,0)}}
.h2{font-size:clamp(1.9rem,4vw,3rem);font-weight:800}
.lead{font-size:clamp(1.05rem,1.6vw,1.25rem);color:var(--ink2);max-width:56ch}
.dk .lead{color:#CDBBA9}
.muted{color:var(--ink2)}.mono{font-family:var(--mono)}
/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;border:1.5px solid transparent;border-radius:999px;padding:.8rem 1.35rem;font-weight:700;text-decoration:none;transition:transform .2s,box-shadow .2s,background .2s;white-space:nowrap}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px -10px var(--glow)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn-cu{background:var(--cu);color:var(--on-cu)}.btn-cu:hover{background:var(--cu-d)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}.btn-ghost:hover{border-color:var(--cu);color:var(--cu)}
.btn-gold{background:var(--gold);color:#1A1109}
.btn-dark{background:var(--dark);color:var(--on-dark)}
.dk .btn-ghost{border-color:var(--dark-line);color:var(--on-dark)}
.btn-lg{padding:1rem 1.7rem;font-size:1.02rem}.btn-sm{padding:.5rem .9rem;font-size:.85rem}
.cta-row{display:flex;flex-wrap:wrap;gap:.8rem}
/* logo */
.logo{display:inline-flex;flex-direction:column;align-items:flex-end;line-height:.8;text-decoration:none}
.lo{font:800 1.9rem var(--display);color:var(--cu);letter-spacing:-.05em}
.ll{font:700 .95rem var(--display);color:var(--logo-ink,var(--ink));letter-spacing:-.01em;margin-top:-.05rem}
/* header */
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg-a);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hd .w{display:flex;align-items:center;gap:1.2rem;min-height:68px}
.nav{display:flex;gap:1.4rem;margin-left:auto;align-items:center}
.nav a{text-decoration:none;font-weight:600;font-size:.93rem;color:var(--ink2);padding:.4rem 0;border-bottom:2px solid transparent}
.nav a:hover,.nav a.on{color:var(--ink);border-color:var(--gold)}
.hd .btn{letter-spacing:.05em;font-size:.82rem;text-transform:uppercase}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:10px;padding:.5rem;margin-left:auto}
@media(max-width:1000px){
 .burger{display:inline-flex}
 .nav{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;align-items:stretch;gap:0;background:var(--bg);border-bottom:1px solid var(--line);padding:.5rem max(16px,env(safe-area-inset-left,0px)) 1rem;margin:0}
 .nav.open{display:flex}.nav a{padding:.8rem 0;border-bottom:1px solid var(--line)}
 .nav .btn{margin-top:.8rem}}
.page{animation:fade .4s both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rise{animation:fade .8s both}
/* hero */
.hero{position:relative;overflow:hidden;padding-block:clamp(36px,6vw,72px) clamp(48px,7vw,88px);background:var(--hero-overlay),url("./studio-ocd-live.png") center 48%/cover no-repeat}
.hero-grid{display:grid;grid-template-columns:1.02fr .98fr;gap:clamp(24px,4vw,64px);align-items:center}
.hero-copy{display:flex;flex-direction:column;gap:1.5rem;min-width:0}
.hero h1{font-size:clamp(2.5rem,6.4vw,5rem);font-weight:800;line-height:.98}
.hero h1 em{font-style:normal;color:var(--cu)}
.ticks{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.5rem 1.4rem;font-size:.92rem;font-weight:600;color:var(--ink2)}
.ticks li{display:flex;align-items:center;gap:.4rem}.ticks .ic{color:var(--cu)}
.stage{position:relative;width:100%;max-width:580px;margin-inline:auto}
.africa{width:100%;height:auto;display:block;overflow:visible}
.halo{animation:pulse 3.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.lg-o{font:800 104px var(--display);fill:var(--cu);letter-spacing:-6px}
.lg-l{font:700 48px var(--display);fill:var(--ink)}
.pin-r{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(3.4);opacity:0}}
.arc{stroke-dasharray:4 6;animation:dash 14s linear infinite}
@keyframes dash{to{stroke-dashoffset:-200}}
.float{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.6rem .8rem;box-shadow:0 18px 40px -22px rgba(60,30,10,.45);font-size:.82rem;display:flex;align-items:center;gap:.6rem}
.live-chip{display:inline-flex;align-items:center;gap:.4rem;background:var(--cu);color:var(--on-cu);border-radius:6px;padding:.2rem .5rem;font:700 .72rem var(--mono);letter-spacing:.08em}
.live-chip i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:ping 1.6s infinite}
@media(max-width:900px){.hero-grid{grid-template-columns:1fr}.stage{max-width:460px}}
/* sections */
.two{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,72px);align-items:start}
.two>*{min-width:0}
@media(max-width:860px){.two{grid-template-columns:1fr}}
.rows{display:flex;flex-direction:column}
.row{display:flex;gap:1rem;padding:1.2rem 0;border-top:1px solid var(--line)}
.row:last-child{border-bottom:1px solid var(--line)}
.row h3{font-size:1.15rem;margin-bottom:.25rem}
.ico{width:46px;height:46px;border-radius:12px;background:var(--cu-soft);color:var(--cu);display:grid;place-items:center;flex:none}
.adv{display:grid;grid-template-columns:repeat(2,1fr);gap:1.6rem 2.4rem;margin-top:2.4rem}
.adv>div{display:flex;gap:1rem}.adv h3{font-size:1.2rem;margin-bottom:.2rem}
@media(max-width:700px){.adv{grid-template-columns:1fr}}
/* type cards */
.types{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem}
@media(max-width:860px){.types{grid-template-columns:1fr}}
.tcard{background:var(--card);border:1.5px solid var(--line);border-radius:26px;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,border-color .25s,box-shadow .25s;min-width:0}
.tcard:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 24px 50px -30px var(--glow)}
.tcard.sel{border-color:var(--cu);box-shadow:0 0 0 3px var(--cu-soft)}
.tcard .illo{background:var(--bg2);padding:1rem}
.tcard .illo svg{width:100%;height:auto;max-height:230px;display:block}
.tbody{padding:1.5rem;display:flex;flex-direction:column;gap:1rem;flex:1}
.tbody h3{font-size:1.6rem}
.tbody ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.5rem}
.tbody li{display:flex;gap:.6rem;align-items:flex-start}.tbody li .ic{color:var(--cu);margin-top:.2rem}
.tbody .btn{margin-top:auto;align-self:flex-start}
/* mini offers */
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:2.2rem}
@media(max-width:900px){.minis{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.minis{grid-template-columns:1fr}}
.mini{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.1rem;display:flex;flex-direction:column;gap:.7rem;text-align:left;transition:border-color .2s,transform .2s;min-width:0}
.mini:hover{border-color:var(--cu);transform:translateY(-2px)}
.mini h3{font-size:1.25rem}.mini .meta{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--ink2)}
.meter{display:inline-flex;gap:3px}.meter i{width:14px;height:6px;border-radius:2px;background:var(--line)}.meter i.f{background:var(--gold)}
/* étapes */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:1rem;margin-top:2.4rem;counter-reset:s}
.st{border-top:3px solid var(--gold);padding-top:1rem;display:flex;flex-direction:column;gap:.4rem}
.st b{font:600 .8rem var(--mono);color:var(--cu)}.st h3{font-size:1.1rem}.st p{font-size:.9rem;color:var(--ink2)}
@media(max-width:900px){.steps{grid-template-columns:1fr 1fr}}@media(max-width:520px){.steps{grid-template-columns:1fr}}
.cta{position:relative;overflow:hidden;text-align:center}
.cta .w{position:relative;display:flex;flex-direction:column;align-items:center;gap:1.4rem}
.cta .wm{position:absolute;inset:-10% 0 auto 50%;width:min(720px,110%);transform:translateX(-50%);opacity:.22;pointer-events:none}
.cta h2{font-size:clamp(2rem,5vw,3.6rem);font-weight:800;max-width:18ch}
/* footer */
.ft{background:var(--dark);color:var(--on-dark);--logo-ink:var(--on-dark);padding-block:3rem 2rem}
.ft-g{display:grid;grid-template-columns:1.4fr 1fr 1.2fr;gap:2rem}
@media(max-width:760px){.ft-g{grid-template-columns:1fr}}
.ft h4{font:600 .78rem var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:.8rem}
.ft ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.5rem}
.ft a{text-decoration:none;color:#D8C8B7}.ft a:hover{color:var(--gold)}
.ft .fine{border-top:1px solid var(--dark-line);margin-top:2rem;padding-top:1.2rem;font-size:.82rem;color:#A8978A}
/* tunnel */
.ph{padding-block:clamp(32px,5vw,56px) 24px}
.ph h1{font-size:clamp(2rem,5vw,3.4rem);font-weight:800;margin:.6rem 0 .8rem}
.flow{display:flex;gap:.4rem;margin:1.6rem 0 0;padding:0;list-style:none;overflow-x:auto;scrollbar-width:none}
.flow li{display:flex;align-items:center;gap:.5rem;font-size:.86rem;font-weight:600;color:var(--ink2);white-space:nowrap;padding:.45rem .8rem;border-radius:999px;border:1px solid var(--line)}
.flow li b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:600 .72rem var(--mono);background:var(--bg2)}
.flow li.on{color:var(--on-cu);background:var(--cu);border-color:var(--cu)}.flow li.on b{background:rgba(255,255,255,.25)}
.flow li.done{color:var(--ink);border-color:var(--gold)}.flow li.done b{background:var(--gold);color:#1A1109}
/* calendrier */
.cal-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:1.4rem;align-items:start}
@media(max-width:940px){.cal-grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:1.4rem;min-width:0}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.cal-h h2{font-size:1.5rem}
.sq{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.sq:hover:not(:disabled){border-color:var(--cu);color:var(--cu)}.sq:disabled{opacity:.35;cursor:not-allowed}
.dows,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dows span{font:600 .72rem var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--ink2);text-align:center;padding-bottom:.4rem}
.day{aspect-ratio:1/.92;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;position:relative;padding:2px}
.day small{font:500 .62rem var(--body);color:var(--ink2)}
.day.av:hover{border-color:var(--cu);transform:translateY(-1px)}
.day.av::after{content:"";position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--ok)}
.day.off{background:var(--bg2);color:var(--ink2);opacity:.55;cursor:not-allowed;border-style:dashed}
.day.full{background:var(--bg2);color:var(--ink2);cursor:not-allowed}
.day.sel{background:var(--cu);border-color:var(--cu);color:var(--on-cu)}.day.sel small{color:inherit}.day.sel::after{background:var(--gold)}
.day.void{border:0;background:none;visibility:hidden}
@media(max-width:520px){.day small{display:none}.day{min-height:42px}}
.legend{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;font-size:.8rem;color:var(--ink2);margin-top:1rem}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:.4rem;vertical-align:-1px}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:.45rem .9rem;font-weight:600;font-size:.9rem}
.chip:hover{border-color:var(--cu)}.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:.5rem}
.slot{border:1.5px solid var(--line);border-radius:10px;background:var(--card);padding:.55rem 0;font:600 .88rem var(--mono)}
.slot:hover:not(:disabled){border-color:var(--cu);color:var(--cu)}
.slot:disabled{background:var(--bg2);color:var(--ink2);text-decoration:line-through;opacity:.5;cursor:not-allowed}
.slot.on{background:var(--cu);border-color:var(--cu);color:var(--on-cu)}
.recap{display:flex;flex-direction:column;gap:.7rem}
.recap dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:.55rem 1rem;font-size:.92rem}
.recap dt{color:var(--ink2)}.recap dd{margin:0;font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}
.stack{display:flex;flex-direction:column;gap:1.2rem}
.lbl{font:600 .76rem var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin-bottom:.6rem;display:block}
.note{display:flex;gap:.6rem;align-items:flex-start;background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:.7rem .9rem;font-size:.9rem;font-weight:500}
.note.ok{background:var(--ok-bg);color:var(--ok)}.note.bad{background:var(--bad-bg);color:var(--bad)}
/* packages */
.packs{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem}
@media(max-width:1000px){.packs{grid-template-columns:repeat(2,1fr)}}@media(max-width:640px){.packs{grid-template-columns:1fr}}
.pk{background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:1.5rem;display:flex;flex-direction:column;gap:1rem;position:relative;min-width:0;transition:transform .25s,border-color .25s}
.pk:hover{transform:translateY(-4px);border-color:var(--gold)}
.pk h3{font-size:1.6rem}
.pk .top{display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem}
.pk .dur{display:inline-flex;align-items:center;gap:.4rem;font:600 .85rem var(--mono);color:var(--ink2)}
.price{font:700 1.5rem var(--display);color:var(--cu)}.price.tbd{font:500 .95rem var(--mono);color:var(--ink2);border:1px dashed var(--line);border-radius:8px;padding:.4rem .6rem;align-self:flex-start}
.pk ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.5rem;font-size:.93rem}
.pk li{display:flex;gap:.55rem;align-items:flex-start}.pk li .ic{color:var(--cu);margin-top:.22rem}
.pk .btn{margin-top:auto}
.pk.sel{border-color:var(--cu);box-shadow:0 0 0 3px var(--cu-soft)}
.pk.vip{background:var(--dark);color:var(--on-dark);border-color:var(--gold);box-shadow:0 30px 60px -34px var(--glow)}
.pk.vip .dur,.pk.vip .price.tbd{color:#CDBBA9;border-color:var(--dark-line)}.pk.vip .price{color:var(--gold)}.pk.vip li .ic{color:var(--gold)}
.pk.vip .meter i{background:var(--dark-line)}.pk.vip .meter i.f{background:var(--gold)}
.badge{position:absolute;top:-11px;right:18px;background:var(--gold);color:#1A1109;font:700 .7rem var(--body);letter-spacing:.1em;text-transform:uppercase;padding:.3rem .7rem;border-radius:999px}
/* formulaire */
.form-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:1.4rem;align-items:start}
@media(max-width:940px){.form-grid{grid-template-columns:1fr}}
.fs{display:flex;gap:.5rem;margin-bottom:1.4rem}
.fs span{flex:1;height:5px;border-radius:3px;background:var(--line)}.fs span.on{background:var(--cu)}.fs span.done{background:var(--gold)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:600px){.fgrid{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:.35rem;min-width:0}.fld.full{grid-column:1/-1}
.fld label{font-weight:600;font-size:.88rem}

function route(){let r=location.hash.slice(1);if(!ROUTES.includes(r))r='accueil';
 if(r==='paiement'&&!(S.type&&S.pack&&S.date&&S.slot!=null)){r='reservation'}
 if(r==='succes'&&!S.last)r='accueil';
 S.route=r;S.menu=false;render();if(!S.keepScroll)window.scrollTo(0,0);S.keepScroll=false}
const go=r=>{if(location.hash==='#'+r)route();else location.hash=r};
window.addEventListener('hashchange',route);
function scrollTo2(id){const f=()=>{const el=document.getElementById(id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})};
 if(S.route!=='accueil'){go('accueil');setTimeout(f,120)}else{S.menu=false;render();f()}}

function validate(st){const F=S.form,e={},need=(k,m)=>{if(!String(F[k]).trim())e[k]=m||'Champ obligatoire'};
 if(st===0){need('nom');need('whatsapp');need('email');need('ville');
  if(F.whatsapp.trim()&&F.whatsapp.replace(/\D/g,'').length<8)e.whatsapp='Numéro trop court';
  if(F.email.trim()&&!/^\S+@\S+\.\S+$/.test(F.email))e.email='Adresse email invalide'}
 if(st===1){need('entreprise');need('domaine');need('produits');need('description')}
 if(st===2){if(!S.type||!S.pack)e.res='Choisissez un type de LIVE et un package.';else if(!S.date||S.slot==null)e.res='Choisissez une date et une heure dans le calendrier.'}
 S.errors=e;return !Object.keys(e).length}

 const F=S.form,n=S.bookings.length+1031,b={id:'OCD-26-'+n,name:F.nom,biz:F.entreprise,dom:F.domaine,country:F.pays,city:F.ville,phone:F.whatsapp,email:F.email,type:S.type,pack:S.pack,date:S.date,start:S.slot,dur:S.dur,status:'confirmee',pay:'paye',prod:F.produits,desc:F.description,addr:F.adresse};
 S.bookings.push(b);addTaken(b);S.notifs.unshift({id:Date.now(),b:b.id,t:'à l’instant',unread:true});S.last=b}
function resetFlow(){S.type=S.pack=S.date=null;S.slot=null;S.step=0;S.method=null;S.pay='idle';S.flow=false;S.errors={};

function act(a,v,el){
 switch(a){
 case 'menu':S.menu=!S.menu;render();break;
 case 'reserve':resetFlowKeep();S.flow=true;go('type');break;
 case 'type':S.type=v;S.flow=true;go(S.pack?'calendrier':'packages');break;
 case 'pack':{S.pack=v;S.dur=getPack(v).dur;S.slot=null;S.flow=true;go(S.type?'calendrier':'type');break}
 case 'mprev':S.month=S.month.m===0?{y:S.month.y-1,m:11}:{y:S.month.y,m:S.month.m-1};render();break;
 case 'mnext':S.month=S.month.m===11?{y:S.month.y+1,m:0}:{y:S.month.y,m:S.month.m+1};render();break;
 case 'date':S.date=v;S.slot=null;S.keepScroll=true;render();break;
 case 'slot':S.slot=+v;S.keepScroll=true;render();break;
 case 'dur':S.dur=+v;if(S.date&&S.slot!=null&&!slotsFor(S.date,S.dur).find(s=>s.c===S.slot&&s.ok))S.slot=null;render();break;
 case 'tform':go('reservation');break;
 case 'demo':Object.assign(S.form,{nom:'Afi Mensah',whatsapp:'+228 90 12 34 56',email:'afi@exemple.test',pays:'Togo',ville:'Lomé',entreprise:'Afi Mode',domaine:'Mode et couture',produits:'Robes, pagnes, accessoires',description:'Collection de fin d’année en tissus locaux.',adresse:''});S.errors={};render();break;
 case 'next':if(validate(S.step)){if(S.step===3)go('paiement');else{S.step++;render();window.scrollTo(0,0)}}else render();break;
 case 'prev':S.step=Math.max(0,S.step-1);S.errors={};render();break;
 case 'step':S.step=+v;S.errors={};render();break;
 case 'method':S.method=v;S.errors={};render();break;
 case 'pay':if(!S.method){S.errors={pay:'Choisissez un moyen de paiement pour la simulation.'};render();break}
  S.pay='processing';render();setTimeout(()=>{finalize();S.pay='done';go('succes')},1000);break;
 case 'again':resetFlow();go('type');break;
 case 'login':S.auth=true;render();break;
 case 'aview':S.view=v;S.detail=null;render();window.scrollTo(0,0);break;
 case 'filter':S.filter=v;render();break;
 case 'detail':S.detail=v;render();break;
 case 'closed':S.detail=null;render();break;
 case 'setst':{const [id,st]=v.split('|'),b=bk(id);b.status=st;if(st==='confirmee'&&b.pay==='attente'){}if(st==='annulee'){for(let c=b.start;c<b.start+b.dur;c+=30)S.taken.delete(b.date+'|'+c)}else addTaken(b);render();break}
 case 'markpaid':bk(v).pay='paye';render();break;
 case 'amprev':S.amonth=S.amonth.m===0?{y:S.amonth.y-1,m:11}:{y:S.amonth.y,m:S.amonth.m-1};render();break;
 case 'amnext':S.amonth=S.amonth.m===11?{y:S.amonth.y+1,m:0}:{y:S.amonth.y,m:S.amonth.m+1};render();break;
 case 'day':S.openDays[v]=!S.openDays[v];render();break;
 case 'block':{const d=document.getElementById('bl').value;if(d&&!S.blocked.includes(d)){S.blocked.push(d);S.blocked.sort()}render();break}
 case 'unblock':S.blocked=S.blocked.filter(d=>d!==v);render();break;
 case 'cfg':S.cfg[v]=!S.cfg[v];render();break;
 case 'readall':S.notifs.forEach(n=>n.unread=false);render();break}}
function resetFlowKeep(){S.errors={};S.step=0}

app.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-act],[data-scroll]');if(!t)return;
 if(t.tagName==='A')e.preventDefault();
 if(t.dataset.go){go(t.dataset.go);return}
 if(t.dataset.scroll){scrollTo2(t.dataset.scroll);return}
 act(t.dataset.act,t.dataset.v,t)});
app.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-act]')){e.preventDefault();act(e.target.dataset.act,e.target.dataset.v)}
 if(e.key==='Escape'&&S.detail){S.detail=null;render()}});
app.addEventListener('input',e=>{const el=e.target,k=el.dataset.bind;
 if(k){if(k.startsWith('f.')){S.form[k.slice(2)]=el.value;const f=el.closest('.fld');if(f&&f.classList.contains('err')){f.classList.remove('err');const m=f.querySelector('.em');if(m)m.remove();delete S.errors[k.slice(2)]}}else S[k]=el.value}
 if(el.dataset.pk){const p=getPack(el.dataset.pk),f=el.dataset.fld;if(f==='perks')p.perks=el.value.split('\n').map(x=>x.trim()).filter(Boolean);else if(f==='dur')p.dur=+el.value;else p[f]=el.value}});
app.addEventListener('change',e=>{const el=e.target;
 if(el.dataset.bind&&el.dataset.bind.startsWith('f.'))S.form[el.dataset.bind.slice(2)]=el.value;
 if(el.dataset.pk&&el.dataset.fld==='dur'){getPack(el.dataset.pk).dur=+el.value}
 if(el.dataset.bindr){const k=el.dataset.bindr;S[k]=el.value||null;if(k==='pack'&&el.value){S.dur=getPack(el.value).dur;S.slot=null}S.keepScroll=true;render()}});
route();
</script>
